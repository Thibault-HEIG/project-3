<!-- 1. MAIN CHAT INTERFACE TEMPLATE -->
<!-- Use with options: { cls: 'ai-chat-popup', title: 'Neural Interface v4.0.2' } -->
<div class="ai-chat-container">
    <div class="ai-chat-messages" id="ai-messages">
        <div class="ai-message bot">Hello. I am the Project 3 Neural Interface. How can I assist you in navigating this... legacy environment?</div>
    </div>
    <div class="ai-chat-input-area">
        <input type="text" class="ai-chat-input" placeholder="Message Project 3 AI..." id="ai-input">
        <button class="ai-send-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
        </button>
    </div>
</div>

<!-- 2. TYPING / LOADING STATE TEMPLATE -->
<!-- Append this to .ai-chat-messages to show the bot is thinking -->
<div class="ai-message bot ai-typing">
    <div class="ai-dot"></div>
    <div class="ai-dot"></div>
    <div class="ai-dot"></div>
</div>

<!-- 3. API LIMIT REACHED ERROR TEMPLATE -->
<!-- Append this to .ai-chat-messages or replace content with it when limit is hit -->
<div class="ai-error">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
    <span><b>API Limit Reached</b><br>Your current session has exceeded the free tier quota. Please contact the administrator or find a valid access token.</span>
</div>
